<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>台灣老街物語</title>
    <meta name="theme-color" content="#1d1b26" />
    <!-- 加到主畫面後可以全螢幕玩（iPhone 不支援網頁全螢幕） -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="老街物語" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0; height: 100%; background: #1d1b26; overflow: hidden;
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game { width: 100vw; height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; }
      #rotate, #ios-tip {
        position: fixed; z-index: 10; font-family: "Noto Sans TC", sans-serif; color: #fbf6ec; text-align: center;
      }
      /* 手機直拿：請轉成橫向 */
      #rotate {
        inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: #1d1b26; font-size: 20px; font-weight: 900;
      }
      #rotate .phone { width: 46px; height: 78px; border: 4px solid #f2c14e; border-radius: 10px; animation: turn 1.6s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
      /* iPhone：加到主畫面的提示 */
      #ios-tip {
        left: 50%; bottom: 12px; transform: translateX(-50%); display: none; max-width: 92vw;
        background: rgba(42, 36, 51, 0.95); border: 2px solid #f2c14e; border-radius: 10px; padding: 8px 36px 8px 14px; font-size: 14px;
      }
      #ios-tip button { position: absolute; right: 6px; top: 4px; background: none; border: 0; color: #f2c14e; font-size: 20px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone"></div>請把手機轉成橫向來玩</div>
    <div id="ios-tip">iPhone 想全螢幕玩：點下方「分享」→「加入主畫面」，再從主畫面開啟。<button aria-label="關閉">×</button></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
